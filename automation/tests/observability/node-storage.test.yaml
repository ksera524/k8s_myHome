rule_files:
- ../../../manifests/platform/observability/config/alert-rules.yaml
evaluation_interval: 1m
tests:
- name: 正常
  interval: 1m
  input_series:
  - series: kube_node_info{node="worker-1"}
    values: 1+0x20
  - series: container_fs_limit_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda1"}
    values: 64424509440+0x20
  - series: container_fs_usage_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda1"}
    values: 21474836480+0x20
  - series: container_fs_limit_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda16"}
    values: 214748364800+0x20
  - series: container_fs_usage_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda16"}
    values: 214748364800+0x20
  alert_rule_test:
  - eval_time: 15m
    alertname: KubernetesNodeDiskSpaceLow
    exp_alerts: []
  - eval_time: 15m
    alertname: KubernetesNodeDiskSpaceCritical
    exp_alerts: []
  - eval_time: 15m
    alertname: KubernetesNodeDiskMetricsUnavailable
    exp_alerts: []
- name: 絶対量の警告
  interval: 1m
  input_series:
  - series: kube_node_info{node="worker-1"}
    values: 1+0x20
  - series: container_fs_limit_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda1"}
    values: 64424509440+0x20
  - series: container_fs_usage_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda1"}
    values: 53687091200+0x20
  - series: container_fs_limit_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda16"}
    values: 214748364800+0x20
  - series: container_fs_usage_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda16"}
    values: 214748364800+0x20
  alert_rule_test:
  - eval_time: 15m
    alertname: KubernetesNodeDiskSpaceLow
    exp_alerts:
    - exp_labels:
        node: worker-1
        severity: warning
      exp_annotations:
        summary: Node worker-1 のルートディスク空き推定値が12GiBまたは20%未満です
  - eval_time: 15m
    alertname: KubernetesNodeDiskSpaceCritical
    exp_alerts: []
  - eval_time: 15m
    alertname: KubernetesNodeDiskMetricsUnavailable
    exp_alerts: []
- name: 絶対量の重大
  interval: 1m
  input_series:
  - series: kube_node_info{node="worker-1"}
    values: 1+0x20
  - series: container_fs_limit_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda1"}
    values: 64424509440+0x20
  - series: container_fs_usage_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda1"}
    values: 55834574848+0x20
  - series: container_fs_limit_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda16"}
    values: 214748364800+0x20
  - series: container_fs_usage_bytes{job="kubelet-node-filesystem",node="worker-1",id="/",device="/dev/vda16"}
    values: 214748364800+0x20
  alert_rule_test:
  - eval_time: 15m
    alertname: KubernetesNodeDiskSpaceLow
    exp_alerts:
    - exp_labels:
        node: worker-1
        severity: warning
      exp_annotations:
        summary: Node worker-1 のルートディスク空き推定値が12GiBまたは20%未満です
  - eval_time: 15m
    alertname: KubernetesNodeDiskSpaceCritical
    exp_alerts:
    - exp_labels:
        node: worker-1
        severity: critical
      exp_annotations:
        summary: Node worker-1 のルートディスク空き推定値が9GiBまたは15%未満です。大容量取得・CIの一時領域を確認してください
  - eval_time: 15m
    alertname: KubernetesNodeDiskMetricsUnavailable
    exp_alerts: []
