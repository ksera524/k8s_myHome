rule_files:
- ../../../manifests/platform/observability/config/alert-rules.yaml
evaluation_interval: 30s
tests:
- name: 失敗は待機後に通知し復旧時に解除する
  interval: 1m
  input_series:
  - series: application_queue_jobs{namespace="sandbox",queue="media",state="failed",pod="old"}
    values: 0 3+0x7 0+0x5
  - series: application_queue_jobs{namespace="sandbox",queue="media",state="failed",pod="new"}
    values: 0 3+0x7 0+0x5
  - series: application_queue_jobs{namespace="sandbox",queue="notifications",state="uncertain"}
    values: 0 1+0x7 0+0x5
  alert_rule_test:
  - eval_time: 5m
    alertname: ApplicationQueueFailed
    exp_alerts: []
  - eval_time: 6m
    alertname: ApplicationQueueFailed
    exp_alerts:
    - exp_labels:
        queue: media
        severity: warning
      exp_annotations:
        summary: media に失敗または配送結果不明の処理があります
    - exp_labels:
        queue: notifications
        severity: warning
      exp_annotations:
        summary: notifications に失敗または配送結果不明の処理があります
  - eval_time: 10m
    alertname: ApplicationQueueFailed
    exp_alerts: []
  promql_expr_test:
  - expr: sum by(queue) (max by(queue,state) (application_queue_jobs{namespace="sandbox",state=~"failed|uncertain"}))
    eval_time: 6m
    exp_samples:
    - labels: '{queue="media"}'
      value: 3
    - labels: '{queue="notifications"}'
      value: 1
- name: キュー別の滞留しきい値と復旧
  interval: 1m
  input_series:
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="notifications"}
    values: 901+0x10 0+0x5
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="hitomi_outbox"}
    values: 900+0x16
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="media"}
    values: 7201+0x10 0+0x5
  alert_rule_test:
  - eval_time: 9m
    alertname: ApplicationQueueBacklog
    exp_alerts: []
  - eval_time: 10m
    alertname: ApplicationQueueBacklog
    exp_alerts:
    - exp_labels:
        queue: notifications
        severity: warning
      exp_annotations:
        summary: notifications の未完了処理が滞留しています
    - exp_labels:
        queue: media
        severity: warning
      exp_annotations:
        summary: media の未完了処理が滞留しています
  - eval_time: 12m
    alertname: ApplicationQueueBacklog
    exp_alerts: []
- name: 空キューは最終成功時刻がゼロでも正常
  interval: 1m
  input_series:
  - series: application_queue_jobs{namespace="sandbox",queue="notifications",state="pending"}
    values: 0+0x20
  - series: application_queue_jobs{namespace="sandbox",queue="hitomi_outbox",state="pending"}
    values: 0+0x20
  - series: application_queue_jobs{namespace="sandbox",queue="media",state="pending"}
    values: 0+0x20
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="notifications"}
    values: 0+0x20
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="hitomi_outbox"}
    values: 0+0x20
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="media"}
    values: 0+0x20
  - series: application_queue_last_success_timestamp_seconds{namespace="sandbox",queue="notifications"}
    values: 0+0x20
  alert_rule_test:
  - eval_time: 20m
    alertname: ApplicationQueueBacklog
    exp_alerts: []
  - eval_time: 20m
    alertname: ApplicationQueueFailed
    exp_alerts: []
  - eval_time: 20m
    alertname: ApplicationQueueMetricsUnavailable
    exp_alerts: []
- name: DB障害や収集停止で消えたキューを検知する
  interval: 1m
  input_series:
  - series: application_queue_jobs{namespace="sandbox",queue="notifications",state="pending"}
    values: 0+0x20
  - series: application_queue_jobs{namespace="sandbox",queue="hitomi_outbox",state="pending"}
    values: 0+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: ApplicationQueueMetricsUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: ApplicationQueueMetricsUnavailable
    exp_alerts:
    - exp_labels:
        namespace: sandbox
        queue: media
        severity: warning
      exp_annotations:
        summary: media の業務メトリクスを収集できません
- name: カメラの集計失敗と復旧
  interval: 1m
  input_series:
  - series: home_camera_spool_stats_success
    values: 0+0x6 1+0x5
  alert_rule_test:
  - eval_time: 5m
    alertname: CameraSpoolStatisticsUnavailable
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: cameraのspool集計結果を確認できません
  - eval_time: 8m
    alertname: CameraSpoolStatisticsUnavailable
    exp_alerts: []
- name: 不正manifestだけ残るspoolと修復後の解除
  interval: 1m
  input_series:
  - series: home_camera_invalid_manifests
    values: 3+0x6 0+0x5
  - series: home_camera_spool_oldest_age_seconds
    values: 0+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: CameraInvalidManifest
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: cameraのspoolに不正なmanifestがあります
  - eval_time: 8m
    alertname: CameraInvalidManifest
    exp_alerts: []
- name: プロセス生存中のsegment停止と復旧
  interval: 1m
  input_series:
  - series: home_camera_recording_stalled
    values: 1+0x3 0+0x4
  alert_rule_test:
  - eval_time: 2m
    alertname: CameraRecordingStalled
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: cameraの完成segmentが停止しています
  - eval_time: 5m
    alertname: CameraRecordingStalled
    exp_alerts: []
- name: 収集項目の失敗と滞留をoutboxとは別に検知する
  interval: 1m
  input_series:
  - series: application_queue_jobs{namespace="sandbox",queue="hitomi_items",state="failed"}
    values: 1+0x12
  - series: application_queue_oldest_pending_age_seconds{namespace="sandbox",queue="hitomi_items"}
    values: 7201+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: ApplicationQueueFailed
    exp_alerts:
    - exp_labels:
        queue: hitomi_items
        severity: warning
      exp_annotations:
        summary: hitomi_items に失敗または配送結果不明の処理があります
  - eval_time: 10m
    alertname: ApplicationQueueBacklog
    exp_alerts:
    - exp_labels:
        queue: hitomi_items
        severity: warning
      exp_annotations:
        summary: hitomi_items の未完了処理が滞留しています
