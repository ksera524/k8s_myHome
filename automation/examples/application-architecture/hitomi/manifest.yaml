apiVersion: batch/v1
kind: Job
metadata:
  name: hitomi-migration
  namespace: sandbox
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: hitomi-migration
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: harbor.qroksera.com/sandbox/hitomi:architecture-20261024
        command:
        - /app/hitomi
        args:
        - --migrate
        env:
        - name: PGDATABASE
          value: hitomi
        - name: PGPOOL_MAX
          value: '1'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
      restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hitomi-monitor
  namespace: sandbox
spec:
  schedule: 55 2,6,10,14,18,22 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: hitomi-monitor
            database.k8s-myhome.local/shared-postgresql: 'true'
        spec:
          containers:
          - name: hitomi-monitor
            image: harbor.qroksera.com/sandbox/hitomi:architecture-20261024
            imagePullPolicy: Always
            env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack
                  key: SLACK_BOT_TOKEN
            - name: RUST_LOG
              value: INFO
            - name: LOG_LEVEL
              value: INFO
            - name: SELENIUM_COMMAND_EXECUTOR
              value: http://selenium-standalone-chrome.tools:4444/wd/hub
            - name: TMPDIR
              value: /tmp
            - name: WRAPPER_API_BASE_URL
              value: http://api-hub.sandbox.svc:3000
            - name: PGDATABASE
              value: hitomi
            - name: PGPOOL_MAX
              value: '2'
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: /etc/postgresql
              readOnly: true
            envFrom:
            - configMapRef:
                name: application-postgresql
            - secretRef:
                name: application-postgresql
          restartPolicy: Never
          volumes:
          - name: tmp
            emptyDir: {}
          - name: database-ca
            configMap:
              name: shared-postgresql-ca
          imagePullSecrets:
          - name: harbor-registry
  timeZone: Asia/Tokyo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitomi-outbox
  namespace: sandbox
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hitomi-outbox
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
      labels:
        app: hitomi-outbox
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: outbox
        ports:
        - name: metrics
          containerPort: 9090
        image: harbor.qroksera.com/sandbox/hitomi:architecture-20261024
        command:
        - /app/hitomi
        args:
        - --dispatch
        env:
        - name: WRAPPER_API_BASE_URL
          value: http://api-hub.sandbox.svc:3000
        - name: PGDATABASE
          value: hitomi
        - name: PGPOOL_MAX
          value: '2'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
  strategy:
    type: Recreate
