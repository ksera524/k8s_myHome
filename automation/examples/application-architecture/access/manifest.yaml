apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hitomi-upload-viewer-internal-redirect
  namespace: sandbox
  annotations:
    contracts.k8s-myhome.local/access-surface: hitomi-upload-viewer-internal
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: nginx-gateway
    namespace: nginx-gateway
    sectionName: http
  hostnames:
  - hitomi-upload-viewer.internal.qroksera.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hitomi-upload-viewer-internal
  namespace: sandbox
  annotations:
    contracts.k8s-myhome.local/access-surface: hitomi-upload-viewer-internal
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: nginx-gateway
    namespace: nginx-gateway
    sectionName: https-hitomi-upload-viewer-internal
  hostnames:
  - hitomi-upload-viewer.internal.qroksera.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /media/
    backendRefs:
    - name: media-api
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: hitomi-upload-viewer
      port: 80
      weight: 1
