name: Renovate

on:
  schedule:
    # 毎日 JST 09:00。マージは手動。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN -e RENOVATE_REPOSITORIES \
            -e RENOVATE_CONFIG_FILE=/config/runner.json \
            -v "$PWD/.github/renovate-runner.json:/config/runner.json:ro" \
            ghcr.io/renovatebot/renovate:44.166.0
      - name: Dispatch validation for Renovate PRs
        # GITHUB_TOKEN で作った PR のイベントは CI を起動しない。
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 automation/scripts/ci/dispatch-renovate-validation.py
