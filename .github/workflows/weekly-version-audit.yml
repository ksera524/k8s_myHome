name: Application Version Updates

on:
  schedule:
    # 毎日 JST 09:00。更新PRのマージは手動。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: application-version-updates
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Find and apply stable updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --command python3 automation/scripts/ci/version-audit.py --apply

      - name: Validate the tracked candidate tree
        env:
          CI: "true"
        run: |
          # ignoreされた同梱chartの漏れをローカルファイルで隠さない。
          git add --all manifests
          candidate_dir="$(mktemp -d)"
          git checkout-index --all --prefix="$candidate_dir/"
          nix develop --command bash "$candidate_dir/automation/scripts/ci/validate.sh"

      - name: Create or update version PR
        id: pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: automation/update-applications
          title: 'chore: Kubernetesアプリを最新安定版へ更新'
          commit-message: 'chore: update Kubernetes applications to stable releases'
          body-path: weekly-version-audit-summary.md
          add-paths: manifests/
          delete-branch: true

      - name: Run PR checks explicitly
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN のpush/PRイベントではCIが起動しないため明示的にdispatchする。
        run: gh workflow run ci-deploy-validate.yml --ref automation/update-applications

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: application-version-audit
          path: weekly-version-audit-summary.md
          if-no-files-found: ignore
