name: Weekly Version Audit

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  version-audit:
    runs-on: ubuntu-latest
    outputs:
      updates_found: ${{ steps.audit.outputs.updates_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          python -m pip install pyyaml packaging

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Audit pinned versions
        id: audit
        run: python automation/scripts/ci/version-audit.py

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-version-audit
          path: |
            weekly-version-audit-summary.md
            weekly-version-audit-issue.md

  create-or-update-issue:
    runs-on: ubuntu-latest
    needs: version-audit
    if: needs.version-audit.outputs.updates_found == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download issue body artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-version-audit

      - name: Create or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const title = 'Weekly Version Audit: updates available'
            const body = fs.readFileSync('weekly-version-audit-issue.md', 'utf8')
            const { owner, repo } = context.repo

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'weekly-audit',
              per_page: 100,
            })

            const existing = issues.find(i => i.title === title)
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              })
              core.info(`Updated issue #${existing.number}`)
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['weekly-audit', 'maintenance', 'dependencies'],
              })
              core.info(`Created issue #${created.data.number}`)
            }
