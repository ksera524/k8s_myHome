name: Setup Integration (disposable VMs)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kubeadm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Set disposable working directory
        run: echo "SETUP_CI_DIR=$RUNNER_TEMP/setup-integration" >> "$GITHUB_ENV"
      - name: Check disposable runner capacity
        run: bash automation/scripts/ci/setup-integration.sh preflight
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Prepare libvirt and isolated configuration
        run: bash automation/scripts/ci/setup-integration.sh prepare
      - name: Validate shared Terraform configuration
        run: |
          sg libvirt -c 'terraform -chdir="$SETUP_CI_DIR/infrastructure" init -input=false'
          sg libvirt -c 'terraform -chdir="$SETUP_CI_DIR/infrastructure" validate'
      - name: Build VMs and Kubernetes using shared Terraform
        timeout-minutes: 35
        run: |
          sg libvirt -c 'terraform -chdir="$SETUP_CI_DIR/infrastructure" apply -auto-approve -input=false -no-color'
      - name: Bootstrap signed kubelet serving certificates
        timeout-minutes: 12
        run: bash automation/scripts/ci/setup-integration.sh certificates
      - name: Verify nodes, cross-node traffic and DNS
        timeout-minutes: 8
        run: bash automation/scripts/ci/setup-integration.sh verify
      - name: Verify Terraform reapply without changes
        timeout-minutes: 5
        run: bash automation/scripts/ci/setup-integration.sh reapply
      - name: Reboot every VM and verify persistent host settings
        timeout-minutes: 25
        run: bash automation/scripts/ci/setup-integration.sh reboot
      - name: Verify cluster and fresh cross-node traffic after reboot
        timeout-minutes: 8
        run: bash automation/scripts/ci/setup-integration.sh verify
      - name: Verify Terraform has no drift after reboot
        timeout-minutes: 5
        run: bash automation/scripts/ci/setup-integration.sh reapply
      - name: Collect diagnostics (no keys or Terraform state)
        if: always()
        timeout-minutes: 3
        run: bash automation/scripts/ci/setup-integration.sh collect
      - name: Destroy disposable Terraform resources
        if: always()
        timeout-minutes: 5
        run: |
          if [ -d "$SETUP_CI_DIR/infrastructure/.terraform" ]; then
            sg libvirt -c 'terraform -chdir="$SETUP_CI_DIR/infrastructure" destroy -auto-approve -input=false -no-color'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-integration-diagnostics
          path: ${{ runner.temp }}/setup-integration/diagnostics/
          retention-days: 7
          if-no-files-found: warn
