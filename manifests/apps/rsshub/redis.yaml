# 再生成できるフィードキャッシュのため永続化しない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub-redis
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub-redis
  template:
    metadata:
      labels:
        app: rsshub-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub-redis
  namespace: sandbox
spec:
  selector:
    app: rsshub-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
