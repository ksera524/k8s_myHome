apiVersion: batch/v1
kind: Job
metadata:
  name: media-migration
  namespace: sandbox
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: media-migration
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: harbor.qroksera.com/sandbox/hitomi-pdf-batch:latest
        command:
        - /app/hitomi-pdf-batch
        args:
        - --migrate
        env:
        - name: PGDATABASE
          value: media
        - name: PGPOOL_MAX
          value: '1'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
      restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hitomi-pdf-monitor
  namespace: sandbox
spec:
  schedule: 50 0,7 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: hitomi-pdf-monitor
            database.k8s-myhome.local/shared-postgresql: 'true'
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: harbor-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: plan
            image: harbor.qroksera.com/sandbox/hitomi-pdf-batch:latest
            command:
            - /app/hitomi-pdf-batch
            args:
            - --plan
            env:
            - name: WRAPPER_API_BASE_URL
              value: http://api-hub.sandbox.svc:3000
            - name: RUSTFS_S3_BUCKET
              value: pdfs
            - name: TZ
              value: Asia/Tokyo
            - name: PUBLIC_API_BASE_URL
              value: https://api-hub.internal.qroksera.com
            - name: MEDIA_DIRECT_DELIVERY
              value: 'true'
            - name: PGDATABASE
              value: media
            - name: PGPOOL_MAX
              value: '2'
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - configMapRef:
                name: application-postgresql
            - secretRef:
                name: application-postgresql
            volumeMounts:
            - name: database-ca
              mountPath: /etc/postgresql
              readOnly: true
          volumes:
          - name: database-ca
            configMap:
              name: shared-postgresql-ca
          restartPolicy: Never
  timeZone: Asia/Tokyo
  suspend: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-api
  namespace: sandbox
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
      labels:
        app: media-api
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: serve
        image: harbor.qroksera.com/sandbox/hitomi-pdf-batch:latest
        command:
        - /app/hitomi-pdf-batch
        args:
        - --serve
        env:
        - name: WRAPPER_API_BASE_URL
          value: http://api-hub.sandbox.svc:3000
        - name: RUSTFS_S3_BUCKET
          value: pdfs
        - name: TZ
          value: Asia/Tokyo
        - name: PUBLIC_API_BASE_URL
          value: https://api-hub.internal.qroksera.com
        - name: MEDIA_DIRECT_DELIVERY
          value: 'true'
        - name: PGDATABASE
          value: media
        - name: PGPOOL_MAX
          value: '3'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 15
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-worker-tmp
  namespace: sandbox
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-external
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: sandbox
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hitomi-pdf-monitor
  template:
    metadata:
      labels:
        app: hitomi-pdf-monitor
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.qroksera.com/sandbox/hitomi-pdf-batch:latest
        command:
        - /app/hitomi-pdf-batch
        args:
        - --worker
        env:
        - name: MAX_ASSET_BYTES
          value: '10737418240'
        - name: WRAPPER_API_BASE_URL
          value: http://api-hub.sandbox.svc:3000
        - name: RUSTFS_S3_BUCKET
          value: pdfs
        - name: TZ
          value: Asia/Tokyo
        - name: PUBLIC_API_BASE_URL
          value: https://api-hub.internal.qroksera.com
        - name: MEDIA_DIRECT_DELIVERY
          value: 'true'
        - name: PGDATABASE
          value: media
        - name: PGPOOL_MAX
          value: '2'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
            ephemeral-storage: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
      - name: tmp
        persistentVolumeClaim:
          claimName: media-worker-tmp
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: media-api
  namespace: sandbox
spec:
  selector:
    app: media-api
  ports:
  - port: 3000
    targetPort: 3000
---
