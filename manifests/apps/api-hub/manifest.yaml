apiVersion: batch/v1
kind: Job
metadata:
  name: api-hub-migration
  namespace: sandbox
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: api-hub-migration
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: harbor.qroksera.com/sandbox/api-hub:latest
        command:
        - /api-hub
        args:
        - --migrate
        env:
        - name: PGDATABASE
          value: api_hub
        - name: PGPOOL_MAX
          value: '1'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
      restartPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-hub
  namespace: sandbox
  annotations:
    reloader.stakater.com/auto: 'true'
  labels:
    app: api-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-hub
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
      labels:
        app: api-hub
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      imagePullSecrets:
      - name: harbor-registry
      containers:
      - name: api-hub
        image: harbor.qroksera.com/sandbox/api-hub:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: sandbox-connection-info
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        env:
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack
              key: SLACK_BOT_TOKEN
        - name: RUSTFS_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: rustfs-auth
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-auth
              key: RUSTFS_SECRET_KEY
        - name: RUST_LOG
          value: INFO
        - name: RUSTFS_S3_BROWSER_ENDPOINT
          value: https://s3.internal.qroksera.com
        - name: PGDATABASE
          value: api_hub
        - name: PGPOOL_MAX
          value: '3'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        command:
        - /api-hub
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
---
apiVersion: v1
kind: Service
metadata:
  name: api-hub
  namespace: sandbox
spec:
  type: ClusterIP
  selector:
    app: api-hub
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-hub-notification-worker
  namespace: sandbox
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-hub-notification-worker
  template:
    metadata:
      labels:
        app: api-hub-notification-worker
        database.k8s-myhome.local/shared-postgresql: 'true'
    spec:
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: notification-worker
        image: harbor.qroksera.com/sandbox/api-hub:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        envFrom:
        - configMapRef:
            name: sandbox-connection-info
        - configMapRef:
            name: application-postgresql
        - secretRef:
            name: application-postgresql
        env:
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack
              key: SLACK_BOT_TOKEN
        - name: RUSTFS_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: rustfs-auth
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-auth
              key: RUSTFS_SECRET_KEY
        - name: RUST_LOG
          value: INFO
        - name: RUSTFS_S3_BROWSER_ENDPOINT
          value: https://s3.internal.qroksera.com
        - name: PGDATABASE
          value: api_hub
        - name: PGPOOL_MAX
          value: '2'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        command:
        - /api-hub
        volumeMounts:
        - name: database-ca
          mountPath: /etc/postgresql
          readOnly: true
        args:
        - --notification-worker
      volumes:
      - name: database-ca
        configMap:
          name: shared-postgresql-ca
  strategy:
    type: Recreate
