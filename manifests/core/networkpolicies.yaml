apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nginx-gateway
  namespace: rustfs
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-nginx
              gateway.networking.k8s.io/gateway-name: nginx-gateway
      ports:
        - protocol: TCP
          port: 9001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-s3-from-api-hub
  namespace: rustfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: rustfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox
          podSelector:
            matchLabels:
              app: api-hub
      ports:
        - protocol: TCP
          port: 9000
