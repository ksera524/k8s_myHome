apiVersion: contracts.k8s-myhome.local/v1alpha1
kind: AccessSurfaceContract
metadata:
  name: home-lab
spec:
  surfaces:
    argocd-external:
      hostname: argocd.qroksera.com
      scheme: https
      exposure: external
      backend:
        service: argocd-server
        namespace: argocd
      gatewayListener: https-argocd-external
      publish:
        coreDNS: false
        tailscaleSplitDNS: false
    argocd-internal:
      hostname: argocd.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: argocd-server
        namespace: argocd
      gatewayListener: https-argocd-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    harbor-external:
      hostname: harbor.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: harbor-core
        namespace: harbor
      gatewayListener: https-harbor-external
      publish:
        coreDNS: true
        tailscaleSplitDNS: false
    harbor-internal:
      hostname: harbor.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: harbor-core
        namespace: harbor
      gatewayListener: https-harbor-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    rustfs-console:
      hostname: rustfs.qroksera.com
      scheme: https
      exposure: external
      backend:
        service: rustfs-svc
        namespace: rustfs
      gatewayListener: https-rustfs
      publish:
        coreDNS: false
        tailscaleSplitDNS: false
    blog-external:
      hostname: blog.qroksera.com
      scheme: https
      exposure: external
      backend:
        service: blog
        namespace: sandbox
      gatewayListener: https-blog-external
      publish:
        coreDNS: false
        tailscaleSplitDNS: false
    cooklog-internal:
      hostname: cooklog.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: cooklog
        namespace: sandbox
      gatewayListener: https-cooklog-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    api-hub-internal:
      hostname: api-hub.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: api-hub
        namespace: sandbox
      gatewayListener: https-api-hub-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    hitomi-upload-viewer-internal:
      hostname: hitomi-upload-viewer.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: hitomi-upload-viewer
        namespace: sandbox
      gatewayListener: https-hitomi-upload-viewer-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    observability-internal:
      hostname: observability.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: victoria-metrics
        namespace: observability
      gatewayListener: https-observability-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    rsshub-internal:
      hostname: rsshub.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: rsshub
        namespace: sandbox
      gatewayListener: https-rsshub-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    blog-internal:
      hostname: blog.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: blog
        namespace: sandbox
      gatewayListener: https-blog-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    rustfs-console-internal:
      hostname: rustfs.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: rustfs-svc
        namespace: rustfs
      gatewayListener: https-rustfs-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    grafana-internal:
      hostname: grafana.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: grafana
        namespace: observability
      gatewayListener: https-grafana-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
    s3-internal:
      hostname: s3.internal.qroksera.com
      scheme: https
      exposure: internal
      backend:
        service: rustfs-svc
        namespace: rustfs
      gatewayListener: https-s3-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
