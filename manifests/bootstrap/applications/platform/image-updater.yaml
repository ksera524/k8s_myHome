apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.2
      helm:
        releaseName: argocd-image-updater
        values: |
          createClusterRoles: false
          config:
            watch.namespaces: argocd
            interval: 2m
            git.user: image-updater
            git.email: image-updater@qroksera.com
            registries:
              - name: Harbor
                prefix: harbor.qroksera.com
                api_url: https://harbor.internal.qroksera.com
                credentials: secret:argocd/image-updater-harbor#credentials
                credsexpire: 5m
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
    - repoURL: https://github.com/home-lab-ksera/k8s_myHome.git
      targetRevision: HEAD
      path: manifests/platform/ci-cd/image-updater
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
