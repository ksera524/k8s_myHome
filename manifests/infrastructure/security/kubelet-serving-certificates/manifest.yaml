apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelet-serving-approver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubelet-serving-approver
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [k8s-control-plane, k8s-worker1, k8s-worker2]
    verbs: [get]
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests]
    verbs: [list]
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests/approval]
    verbs: [update]
  - apiGroups: [certificates.k8s.io]
    resources: [signers]
    resourceNames: [kubernetes.io/kubelet-serving]
    verbs: [approve]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelet-serving-approver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubelet-serving-approver
subjects:
  - kind: ServiceAccount
    name: kubelet-serving-approver
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelet-serving-approver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubelet-serving-approver
  template:
    metadata:
      labels:
        app: kubelet-serving-approver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kubelet-serving-approver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # 独自registryや外部Goモジュールに依存せず、Git上の正本をオフラインでビルドする。
      initContainers:
        - name: build
          image: golang:1.25.3-alpine
          command: [go, build, -trimpath, -o, /work/approver, /src/approver.go]
          env:
            - name: CGO_ENABLED
              value: "0"
            - name: GOTOOLCHAIN
              value: local
            - name: GOPROXY
              value: "off"
            - name: GOSUMDB
              value: "off"
            - name: GOCACHE
              value: /tmp/go-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 768Mi
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
            - name: binary
              mountPath: /work
            - name: build-cache
              mountPath: /tmp
      containers:
        - name: approver
          image: alpine:3.24.2
          command: [/work/approver]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: binary
              mountPath: /work
              readOnly: true
            - name: inventory
              mountPath: /config
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: kubelet-serving-approver-source
        - name: inventory
          configMap:
            name: kubelet-serving-approver-inventory
        - name: binary
          emptyDir:
            sizeLimit: 32Mi
        - name: build-cache
          emptyDir:
            sizeLimit: 512Mi
