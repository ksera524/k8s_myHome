# 内部公開用個別証明書
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-internal
  namespace: nginx-gateway
spec:
  secretName: argocd-internal-tls
  duration: 8760h # 1年
  renewBefore: 720h # 30日前から更新
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - argocd.internal.qroksera.com
  usages:
    - digital signature
    - key encipherment
    - server auth
---
