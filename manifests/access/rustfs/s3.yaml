apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-internal
  namespace: rustfs
  annotations:
    contracts.k8s-myhome.local/access-surface: s3-internal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-s3-internal
  hostnames:
    - s3.internal.qroksera.com
  rules:
    # Host/path/queryを変更しない。書き込みとbucket一覧はこの経路で公開しない。
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /pdfs/hitomi/
        - method: GET
          path:
            type: PathPrefix
            value: /pdfs/videos/
        - method: HEAD
          path:
            type: PathPrefix
            value: /pdfs/hitomi/
        - method: HEAD
          path:
            type: PathPrefix
            value: /pdfs/videos/
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /pdfs/hitomi/
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /pdfs/videos/
      backendRefs:
        - group: ""
          kind: Service
          name: rustfs-svc
          port: 9000
          weight: 1
