# RustFS外部公開用HTTPRoute（HTTP→HTTPSリダイレクト）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console-redirect
  namespace: rustfs
  annotations:
    contracts.k8s-myhome.local/access-surface: rustfs-console
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - rustfs.qroksera.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
# RustFS外部公開用HTTPRoute（HTTPS）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
  annotations:
    contracts.k8s-myhome.local/access-surface: rustfs-console
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-rustfs
  hostnames:
    - rustfs.qroksera.com
  rules:
    # コンソールは専用パスで配信されるため、ルートへのアクセスを転送する。
    - matches:
        - method: GET
          path:
            type: Exact
            value: /
        - method: HEAD
          path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /rustfs/console/
            statusCode: 302
    - matches:
        # Exact の GET / HEAD と同じパスで認証リクエストも明示する。
        - method: POST
          path:
            type: Exact
            value: /
        - method: GET
          path:
            type: Exact
            value: /
          headers:
            - name: Authorization
              type: RegularExpression
              value: .+
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: rustfs-svc
          port: 9001
          weight: 1
---
