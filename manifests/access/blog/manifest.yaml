# blog外部公開用HTTPRoute（HTTP→HTTPSリダイレクト）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog-external-redirect
  namespace: sandbox
  annotations:
    contracts.k8s-myhome.local/access-surface: blog-external
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - blog.qroksera.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# blog外部公開用HTTPRoute（HTTPS）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog-external
  namespace: sandbox
  annotations:
    contracts.k8s-myhome.local/access-surface: blog-external
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-blog-external
  hostnames:
    - blog.qroksera.com
  rules:
    - backendRefs:
        - name: blog
          port: 80
