# api-hub内部公開用HTTPRoute（HTTP→HTTPSリダイレクト）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-hub-internal-redirect
  namespace: sandbox
  annotations:
    contracts.k8s-myhome.local/access-surface: api-hub-internal
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - api-hub.internal.qroksera.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# api-hub内部公開用HTTPRoute（HTTPS）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-hub-internal
  namespace: sandbox
  annotations:
    contracts.k8s-myhome.local/access-surface: api-hub-internal
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-internal
  hostnames:
    - api-hub.internal.qroksera.com
  rules:
    - backendRefs:
        - name: api-hub
          port: 3000
