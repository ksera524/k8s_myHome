apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
  namespace: nginx-gateway
  annotations:
    contracts.k8s-myhome.local/domain-external: global.domain.external
    contracts.k8s-myhome.local/domain-internal: global.domain.internal
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd-external
      hostname: argocd.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-external-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-rustfs
      hostname: rustfs.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-external-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-harbor-external
      hostname: harbor.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-external-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd-internal
      hostname: argocd.internal.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: argocd-internal-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-harbor-internal
      hostname: harbor.internal.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: harbor-internal-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-cooklog-internal
      hostname: cooklog.internal.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: cooklog-internal-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-api-hub-internal
      hostname: api-hub.internal.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: api-hub-internal-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-hitomi-upload-viewer-internal
      hostname: hitomi-upload-viewer.internal.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: hitomi-upload-viewer-internal-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-observability-internal
      hostname: observability.internal.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: observability-internal-tls
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-blog-external
      hostname: blog.qroksera.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
