# hitomi-upload-viewer内部公開用HTTPRoute（HTTP→HTTPSリダイレクト）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hitomi-upload-viewer-internal-redirect
  namespace: sandbox
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - hitomi-upload-viewer.internal.qroksera.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# hitomi-upload-viewer内部公開用HTTPRoute（HTTPS）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hitomi-upload-viewer-internal
  namespace: sandbox
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-internal
  hostnames:
    - hitomi-upload-viewer.internal.qroksera.com
  rules:
    - backendRefs:
        - name: hitomi-upload-viewer
          port: 80
