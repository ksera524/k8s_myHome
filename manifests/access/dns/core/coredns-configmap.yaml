# CoreDNS設定（内部公開ドメインを固定IPに解決）
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    contracts.k8s-myhome.local/service-ip: network.serviceIPs.gateway
    contracts.k8s-myhome.local/access-surfaces: harbor-external,harbor-internal,argocd-internal,cooklog-internal,hitomi-upload-viewer-internal,api-hub-internal
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        hosts {
            192.168.122.100 harbor.qroksera.com
            192.168.122.100 harbor.internal.qroksera.com
            192.168.122.100 argocd.internal.qroksera.com
            192.168.122.100 cooklog.internal.qroksera.com
            192.168.122.100 hitomi-upload-viewer.internal.qroksera.com
            192.168.122.100 api-hub.internal.qroksera.com
            fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
