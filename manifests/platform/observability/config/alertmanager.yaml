global:
  resolve_timeout: 5m
route:
  receiver: slack
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: slack
    slack_configs:
      # 通知先 channel は Incoming Webhook 作成時に指定する。
      - api_url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        title_link: ''
        text: |-
          {{ range .Alerts }}
          *{{ .Labels.severity }}* / {{ .Labels.cluster }} {{ .Labels.namespace }}
          {{ .Annotations.summary }}
          {{ end }}
