apiVersion: 1
prune: true
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
  - name: PostgreSQL / registry
    uid: postgresql-registry
    type: grafana-postgresql-datasource
    access: proxy
    url: shared-postgresql-primary.database.svc:5432
    user: app
    editable: false
    jsonData:
      database: registry
      sslmode: verify-full
      tlsConfigurationMethod: file-path
      sslRootCertFile: /etc/postgresql-ca/ca.crt
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 1
      maxIdleConnsAuto: false
      connMaxLifetime: 300
    secureJsonData:
      password: $POSTGRESQL_PASSWORD
