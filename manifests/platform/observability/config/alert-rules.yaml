groups:
  - name: home-lab-state
    interval: 30s
    rules:
      - alert: NetworkPolicyControllerUnavailable
        expr: >-
          (kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="kube-network-policies"}
          > kube_daemonset_status_number_available{namespace="kube-system",daemonset="kube-network-policies"})
          or absent(kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="kube-network-policies"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NetworkPolicy controller が不足しています（fail-open により通信制限が解除される可能性）"
      - alert: NetworkPolicyControllerMetricsUnavailable
        expr: >-
          up{job="kubernetes-pods-annotated",namespace="kube-system",pod=~"kube-network-policies-.*"} == 0
          or absent(up{job="kubernetes-pods-annotated",namespace="kube-system",pod=~"kube-network-policies-.*"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NetworkPolicy controller の metrics を収集できません"
      - alert: KubeletServingCertificateInvalid
        expr: >-
          kubelet_serving_certificate_valid == 0 or absent(kubelet_serving_certificate_valid)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "kubelet serving 証明書を検証できません"
      - alert: KubeletServingCertificateExpiring
        expr: >-
          (kubelet_serving_certificate_expiry_seconds - time() < 14 * 86400)
          and (kubelet_serving_certificate_valid == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} の serving 証明書の有効期限が14日以内です"
      - alert: KubeletServingApproverUnavailable
        expr: >-
          time() - kubelet_serving_approver_last_success_seconds > 180
          or absent(kubelet_serving_approver_last_success_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "kubelet serving CSR 自動承認処理が停止しています"
      - alert: KubeStateMetricsUnavailable
        expr: >-
          up{job="kube-state-metrics"} == 0 or absent(up{job="kube-state-metrics"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes の状態メトリクスを収集できません"
      - alert: KubernetesNodeNotReady
        expr: >-
          kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} が Ready ではありません"
      - alert: KubernetesPodNotReady
        expr: >-
          (kube_pod_status_ready{condition="true"} == 0) and on(namespace,pod,uid) (kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} が Ready ではありません"
      - alert: KubernetesPodRestarting
        expr: >-
          increase(kube_pod_container_status_restarts_total[15m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} のコンテナが再起動を繰り返しています"
      - alert: KubernetesDeploymentUnavailable
        expr: >-
          kube_deployment_spec_replicas > kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} の必要 replica が不足しています"
      - alert: KubernetesPVCNotBound
        expr: >-
          kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} が Bound ではありません"
      - alert: ArgoCDApplicationOutOfSync
        expr: >-
          kube_argocd_application_sync_status{status=~"OutOfSync|Unknown"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Application {{ $labels.application }} が同期できていません"
      - alert: ArgoCDApplicationUnhealthy
        expr: >-
          kube_argocd_application_health_status{status=~"Degraded|Missing|Unknown"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Application {{ $labels.application }} が異常状態です"
      - alert: ExternalSecretNotReady
        expr: >-
          kube_externalsecret_status_condition{type="Ready"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.externalsecret }} が Ready ではありません"
      - alert: GatewayNotProgrammed
        expr: >-
          kube_gateway_status_condition{type="Programmed"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Gateway {{ $labels.namespace }}/{{ $labels.gateway }} が Programmed ではありません"
      - alert: CertificateNotReady
        expr: >-
          kube_certificate_status_condition{type="Ready"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.certificate }} が Ready ではありません"
      - alert: KubernetesVolumeSpaceLow
        expr: >-
          min by(namespace,persistentvolumeclaim)
          (kubelet_volume_stats_available_bytes / (kubelet_volume_stats_capacity_bytes > 0)) < 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} のファイルシステム空き容量が 20% 未満です（NFS は共有容量）"
      - alert: KubernetesVolumeSpaceCritical
        expr: >-
          min by(namespace,persistentvolumeclaim)
          (kubelet_volume_stats_available_bytes / (kubelet_volume_stats_capacity_bytes > 0)) < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} のファイルシステム空き容量が 10% 未満です（NFS は共有容量）"
      - alert: KubeletVolumeScrapeUnavailable
        expr: >-
          up{job="kubelet-volume-stats"} == 0 or absent(up{job="kubelet-volume-stats"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "kubelet の容量メトリクスを収集できません"
