apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.0
          args:
            - "-rule=/etc/vmalert/alert-rules.yaml"
            - "-datasource.url=http://victoria-metrics:8428"
            - "-notifier.url=http://alertmanager:9093"
            - "-remoteWrite.url=http://victoria-metrics:8428"
            - "-remoteRead.url=http://victoria-metrics:8428"
            - "-external.label=cluster=home-lab"
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vmalert
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-alert-rules
