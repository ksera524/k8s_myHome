apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape-config
  namespace: observability
data:
  scrape.yaml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.observability.svc.cluster.local:8080

      # kubelet に直接接続し、CA 検証と nodes/metrics の get 権限を使用する。
      - job_name: kubelet-volume-stats
        scheme: https
        metrics_path: /metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
          # 実クラスタの既存 instance（ノード名）を維持して時系列を継続する。
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: kubelet_volume_stats_(available|capacity|used)_bytes

      # kubelet に直接接続し、CA 検証と nodes/metrics の get 権限を使用する。
      - job_name: kubelet-resources
        scheme: https
        metrics_path: /metrics/resource
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
          # 実クラスタの既存 instance（ノード名）を維持して時系列を継続する。
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: (node|pod|container)_(cpu_usage_seconds_total|memory_working_set_bytes)|resource_scrape_error

      - job_name: kubernetes-pods-annotated
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics-observability
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics-observability
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-external
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: victoria-metrics
spec:
  selector:
    app.kubernetes.io/name: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: victoria-metrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
    spec:
      serviceAccountName: victoria-metrics
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.154.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -promscrape.config=/etc/victoria-metrics/scrape.yaml
            - -promscrape.configCheckInterval=30s
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: scrape-config
              mountPath: /etc/victoria-metrics
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-metrics-data
        - name: scrape-config
          configMap:
            name: victoria-metrics-scrape-config
