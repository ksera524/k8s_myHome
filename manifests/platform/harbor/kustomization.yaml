apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - maintenance.yaml

helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: 1.19.4
    releaseName: harbor
    namespace: harbor
    valuesFile: values.yaml

patches:
  - path: harbor-database-patch.yaml
  - path: harbor-jobservice-database-patch.yaml
  - path: harbor-core-configmap-patch.yaml
    target:
      kind: ConfigMap
      name: harbor-core

configMapGenerator:
  - name: harbor-db-scripts
    namespace: harbor
    files:
      - scripts/wait-for-database.sh
  - name: harbor-maintenance-scripts
    namespace: harbor
    files:
      - scripts/maintenance.py
  - name: harbor-maintenance-config
    namespace: harbor
    files:
      - maintenance.json
