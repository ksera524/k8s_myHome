expose:
  type: clusterIP
  tls:
    enabled: false

externalURL: https://harbor.qroksera.com

existingSecretSecretKey: harbor-internal-secret

existingSecretAdminPassword: harbor-admin-secret
existingSecretAdminPasswordKey: password

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      size: 10Gi
      storageClass: nfs-external
    jobservice:
      jobLog:
        size: 1Gi
        storageClass: nfs-external
    database:
      size: 1Gi
      storageClass: nfs-external
    redis:
      size: 1Gi
      storageClass: nfs-external
    trivy:
      size: 5Gi
      storageClass: nfs-external

database:
  type: external
  external:
    host: shared-postgresql-primary.database.svc
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-database-secret
    sslmode: verify-full
  maxOpenConns: 10
  maxIdleConns: 3

redis:
  type: internal

trivy:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

core:
  existingSecret: harbor-internal-secret
  secretName: harbor-internal-secret
  existingXsrfSecret: harbor-internal-secret
  existingXsrfSecretKey: CSRF_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

portal:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

registry:
  existingSecret: harbor-internal-secret
  credentials:
    existingSecret: harbor-internal-secret
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

chartmuseum:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

jobservice:
  existingSecret: harbor-internal-secret
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi
