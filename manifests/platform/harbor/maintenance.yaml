apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-maintenance
  namespace: harbor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-maintenance
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-maintenance
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: harbor-maintenance
    namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-maintenance
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [argocd-image-updater.argoproj.io]
    resources: [imageupdaters]
    resourceNames: [sandbox-images]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-maintenance
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: harbor-maintenance
    namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-maintenance
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-maintenance
  namespace: harbor
spec:
  suspend: true
  schedule: "*/5 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: harbor-maintenance
        spec:
          serviceAccountName: harbor-maintenance
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              image: python:3.13-alpine
              command: [python3, -B, /scripts/maintenance.py]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: auth
                  mountPath: /auth
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: harbor-maintenance-scripts
            - name: config
              configMap:
                name: harbor-maintenance-config
            - name: auth
              secret:
                secretName: harbor-admin-secret
                defaultMode: 0440
                items:
                  - key: password
                    path: password
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-harbor-maintenance
  namespace: harbor
spec:
  podSelector:
    matchLabels:
      app: harbor-maintenance
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: harbor
              component: core
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.122.10/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-maintenance
  namespace: harbor
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [harbor-maintenance]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-maintenance
  namespace: harbor
subjects:
  - kind: ServiceAccount
    name: harbor-maintenance
    namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-maintenance
