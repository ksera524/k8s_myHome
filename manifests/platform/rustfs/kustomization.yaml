apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - lifecycle-job.yaml
  - lifecycle-networkpolicy.yaml

configMapGenerator:
  - name: rustfs-lifecycle
    namespace: rustfs
    files:
      - lifecycle.json
      - buckets.txt
      - apply-lifecycle.sh

helmCharts:
  - name: rustfs
    repo: https://charts.rustfs.com
    version: 0.0.83
    releaseName: rustfs
    namespace: rustfs
    valuesFile: values.yaml
