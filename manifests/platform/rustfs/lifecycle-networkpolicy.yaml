apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-s3-from-rustfs-lifecycle
  namespace: rustfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: rustfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rustfs-lifecycle
      ports:
        - protocol: TCP
          port: 9000
