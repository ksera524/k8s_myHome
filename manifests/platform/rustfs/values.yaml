replicaCount: 1

# 観測値と反映後の確認方法: docs/resource-sizing.md
resources:
  requests:
    cpu: 100m
    memory: 1536Mi
  limits:
    # メモリは制限し、CPU は転送時にノードの余力を利用する。
    memory: 3Gi

mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

config:
  rustfs:
    address: ":9000"
    console_address: ":9001"
    console_enable: "true"
    volumes: "/data"

secret:
  existingSecret: rustfs-auth

service:
  type: ClusterIP

ingress:
  enabled: false

storageclass:
  name: nfs-external
  dataStorageSize: 3Ti
  logStorageSize: 10Gi
