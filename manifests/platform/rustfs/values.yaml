replicaCount: 1

mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

config:
  rustfs:
    address: ":9000"
    console_address: ":9001"
    console_enable: "true"
    volumes: "/data"

secret:
  existingSecret: rustfs-auth

service:
  type: ClusterIP

ingress:
  enabled: false

storageclass:
  name: nfs-external
  dataStorageSize: 3Ti
  logStorageSize: 10Gi
