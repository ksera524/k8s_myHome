debug: false
# VM の CPU 設定を修正するまで停止。UBI 9 は x86-64-v2 が必要。
replicas: 0

# Operator は専用 Namespace に置き、DB Namespace だけを監視する。
extraEnv:
  - name: PGO_TARGET_NAMESPACE
    value: database

resources:
  controller:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
