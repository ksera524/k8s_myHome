apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  namespace: database
  name: shared-postgresql
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  postgresVersion: 18
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-18.6-2633
  instances:
    - name: main
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      dataVolumeClaimSpec:
        storageClassName: nfs-postgresql
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
  users:
    - name: postgres
    - name: harbor
      databases: [registry]
      options: "NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 30"
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          max_connections: 100
          shared_buffers: 128MB
          password_encryption: scram-sha-256
  backups:
    pgbackrest:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbackrest:ubi9-2.59.0-2633
      global:
        repo1-retention-full: "3"
      repos:
        - name: repo1
          schedules:
            full: "0 18 * * 0"
            differential: "0 18 * * 1-6"
          volume:
            volumeClaimSpec:
              storageClassName: nfs-postgresql
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi
