apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-ca-publisher
  namespace: observability
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [shared-postgresql-ca]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-ca-publisher
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-ca-publisher
subjects:
  - kind: ServiceAccount
    name: postgresql-credentials
    namespace: database
