apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: database
  name: postgresql-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: database
  name: postgresql-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - shared-postgresql-pguser-postgres
      - shared-postgresql-pguser-harbor
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shared-postgresql-cluster-cert]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: database
  name: postgresql-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-credentials
subjects:
  - kind: ServiceAccount
    name: postgresql-credentials
    namespace: database
---
apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: database
  name: postgresql-credentials
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 100
      template:
        metadata:
          labels:
            app: postgresql-credentials
        spec:
          serviceAccountName: postgresql-credentials
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-18.6-2633
              command: [python3, /scripts/reconcile.py]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: input
                  mountPath: /input
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: postgresql-credentials-scripts
            - name: input
              secret:
                secretName: postgresql-input
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: database
  name: shared-postgresql
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: shared-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
          podSelector:
            matchLabels:
              app: harbor
      ports:
        - protocol: TCP
          port: 5432
