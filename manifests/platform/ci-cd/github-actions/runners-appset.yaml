apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: arc-runners
  namespace: argocd
spec:
  goTemplate: true
  generators:
  - list:
      elements:
      - name: harbor-publish
        githubOwner: home-lab-ksera
        runnerName: harbor-publish-runners
        runnerGroup: harbor-publish
        minRunners: '0'
        maxRunners: '2'
  template:
    metadata:
      name: '{{ .name }}-runner'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '9'
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: ghcr.io/actions/actions-runner-controller-charts
        chart: gha-runner-scale-set
        targetRevision: 0.15.0
        helm:
          releaseName: '{{ .runnerName }}'
          parameters:
          - name: githubConfigUrl
            value: https://github.com/{{ .githubOwner }}
          - name: runnerGroup
            value: '{{ .runnerGroup }}'
          - name: githubConfigSecret
            value: github-multi-repo-secret
          - name: minRunners
            value: '{{ .minRunners }}'
          - name: maxRunners
            value: '{{ .maxRunners }}'
          - name: controllerServiceAccount.namespace
            value: arc-systems
          - name: controllerServiceAccount.name
            value: arc-controller-gha-rs-controller
          values: |
            template:
              spec:
                serviceAccountName: github-actions-runner
                hostAliases:
                  - ip: 192.168.122.100
                    hostnames:
                      - harbor.internal.qroksera.com
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1001
                  runAsGroup: 1001
                  fsGroup: 1001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: runner
                    image: ghcr.io/actions/actions-runner:latest
                    command: ["/home/runner/run.sh"]
                    resources:
                      requests:
                        cpu: 500m
                        memory: 512Mi
                        ephemeral-storage: 2Gi
                      limits:
                        memory: 1Gi
                        ephemeral-storage: 8Gi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: work
                        mountPath: /home/runner/_work
                      - name: harbor-auth
                        mountPath: /etc/harbor-auth
                        readOnly: true
                volumes:
                  - name: work
                    emptyDir:
                      sizeLimit: 6Gi
                  - name: harbor-auth
                    secret:
                      secretName: harbor-ci-auth
                      defaultMode: 0440
      destination:
        server: https://kubernetes.default.svc
        namespace: arc-systems
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
