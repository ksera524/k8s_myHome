apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ARC version single source of truth
  - arc-version-configmap.yaml
  # ARC Controller (ArgoCD Application経由でHelm chartをデプロイ)
  - arc-controller.yaml
  # ARC RunnerScaleSet (ApplicationSetでGitOps管理)
  - runners-appset.yaml
  # Runner Pod ServiceAccount（sandbox rollout と harbor-auth 読み取りに限定）
  - github-actions-rbac.yaml
  # GitHub PAT は platform/secrets/external-secrets/github-actions/ で管理
  # Runner ScaleSetは runners-appset.yaml の list generator をGit管理する
  # 追加Runnerは make add-runner で runners-appset.yaml と workflow を生成する

replacements:
  - source:
      kind: ConfigMap
      name: arc-version
      fieldPath: data.controllerChartVersion
    targets:
      - select:
          kind: Application
          name: arc-controller
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: arc-runners
        fieldPaths:
          - spec.template.spec.source.targetRevision
