# Git 専用の write credential と Harbor の pull-only Robot Account。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-updater-git
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: image-updater-git
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        sshPrivateKey: '{{ .privateKey }}'
  data:
    - secretKey: privateKey
      remoteRef:
        key: image_updater.git_ssh_private_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-updater-harbor
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: image-updater-harbor
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials: '{{ .username }}:{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: harbor.image_updater_username
    - secretKey: password
      remoteRef:
        key: harbor.image_updater_password
