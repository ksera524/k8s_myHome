apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    # 空の Secret は ArgoCD upstream が作成し、値だけを ESO が管理する。
    creationPolicy: Merge
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: alertmanager-slack-webhook-url
