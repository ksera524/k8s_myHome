apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-internal-secret
  namespace: harbor
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: harbor-internal-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: harbor-internal-core-secret
    - secretKey: secretKey
      remoteRef:
        key: harbor-internal-encryption-key
    - secretKey: tls.crt
      remoteRef:
        key: harbor-internal-token-cert
    - secretKey: tls.key
      remoteRef:
        key: harbor-internal-token-key
    - secretKey: CSRF_KEY
      remoteRef:
        key: harbor-internal-xsrf-key
    - secretKey: JOBSERVICE_SECRET
      remoteRef:
        key: harbor-internal-jobservice-secret
    - secretKey: REGISTRY_HTTP_SECRET
      remoteRef:
        key: harbor-internal-registry-secret
    - secretKey: REGISTRY_PASSWD
      remoteRef:
        key: harbor-internal-registry-password
    - secretKey: REGISTRY_HTPASSWD
      remoteRef:
        key: harbor-internal-registry-htpasswd
