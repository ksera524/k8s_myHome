apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-internal-secret
  namespace: harbor
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: harbor-internal-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: harbor.core_secret
    - secretKey: secretKey
      remoteRef:
        key: harbor.encryption_key
    - secretKey: tls.crt
      remoteRef:
        key: harbor.token_cert
    - secretKey: tls.key
      remoteRef:
        key: harbor.token_key
    - secretKey: CSRF_KEY
      remoteRef:
        key: harbor.xsrf_key
    - secretKey: JOBSERVICE_SECRET
      remoteRef:
        key: harbor.jobservice_secret
    - secretKey: REGISTRY_HTTP_SECRET
      remoteRef:
        key: harbor.registry_secret
    - secretKey: REGISTRY_PASSWD
      remoteRef:
        key: harbor.registry_password
    - secretKey: REGISTRY_HTPASSWD
      remoteRef:
        key: harbor.registry_htpasswd
