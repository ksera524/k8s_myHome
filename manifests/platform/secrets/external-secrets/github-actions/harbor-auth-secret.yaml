apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-auth-secret
  namespace: arc-systems
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: github-actions-auth
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 20s
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: harbor-ci-auth
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        HARBOR_USERNAME: '{{ .username }}'
        HARBOR_PASSWORD: '{{ .password }}'
        HARBOR_URL: "harbor.internal.qroksera.com"
        HARBOR_PROJECT: "sandbox"
  data:
    - secretKey: username
      remoteRef:
        key: harbor.ci_username
    - secretKey: password
      remoteRef:
        key: harbor.ci_password
