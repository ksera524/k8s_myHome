apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-database-secret
  namespace: harbor
spec:
  refreshInterval: 20s
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: harbor-database-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgresql.password
