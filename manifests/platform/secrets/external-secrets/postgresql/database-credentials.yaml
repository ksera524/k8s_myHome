apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-input
  namespace: database
spec:
  refreshInterval: 20s
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: postgresql-input
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: postgresql.admin_password
    - secretKey: harbor-password
      remoteRef:
        key: postgresql.harbor_password
