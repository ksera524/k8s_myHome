apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-postgresql
  namespace: sandbox
spec:
  refreshInterval: 20s
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: application-postgresql
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgresql.password
